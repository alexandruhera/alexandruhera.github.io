name: Preview

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Preview deploy and link check
    runs-on: ubuntu-latest
    env:
      # Preview deploys are Cloudflare-only (V2). Until the secrets exist,
      # PRs still build and link-check but skip the deploy + comment steps.
      CF_CONFIGURED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Build site
        run: |
          npm ci
          npm run build

      - name: Link check (internal)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --offline
            --include-fragments
            --root-dir ${{ github.workspace }}/dist
            dist
          fail: true

      - name: Deploy preview to Cloudflare Pages
        id: preview
        if: env.CF_CONFIGURED == 'true'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=alexandruhera-com --branch=pr-${{ github.event.number }}

      - name: Comment preview URL on PR
        if: env.CF_CONFIGURED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.preview.outputs.deployment-url }}
          ALIAS: ${{ steps.preview.outputs.pages-deployment-alias-url }}
        run: |
          gh pr comment "${{ github.event.number }}" \
            --repo "${{ github.repository }}" \
            --edit-last --create-if-none \
            --body "**Preview:** ${ALIAS:-$URL}"
